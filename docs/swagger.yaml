      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Statistik pertumbuhan
      tags:
      - Reporting
  /admin/reporting/recipe-stats:
    get:
      description: Statistik jumlah resep (pending/approved/rejected)
