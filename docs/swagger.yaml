basePath: /api
definitions:
  models.AddTagInput:
    properties:
      tag_id:
        type: integer
    required:
    - tag_id
    type: object
  models.CreateCategoryInput:
    properties:
      category_name:
        type: string
    required:
    - category_name
    type: object
  models.CreateTagInput:
    properties:
      category_id:
        type: integer
      tag_name:
        type: string
    required:
    - category_id
    - tag_name
    type: object
  models.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
      recaptcha_token:
        type: string
    required:
    - email
    - password
    - recaptcha_token
    type: object
  models.RegisterInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      recaptcha_token:
        type: string
    required:
    - email
    - name
    - password
    - recaptcha_token
    type: object
  models.UpdateCategoryInput:
    properties:
      category_name:
        type: string
    required:
    - category_name
    type: object
  models.UpdateMenuStatusInput:
    properties:
      rejection_reason:
        type: string
      status:
        enum:
        - approved
        - rejected
        type: string
    required:
    - status
    type: object
  models.UpdateTagInput:
    properties:
      category_id:
        type: integer
      tag_name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Backend untuk aplikasi Creacipe - Platform berbagi resep masakan.
  title: Creacipe API
  version: "1.0"
paths:
  /admin/evaluation/logs:
    get:
      description: Mengambil log evaluasi ML service real-time (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Log evaluasi ML
      tags:
      - Admin
  /admin/logs:
    get:
      description: Mengambil log aktivitas sistem dengan pagination (admin only)
      parameters:
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 20
        description: Jumlah per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Log aktivitas
      tags:
      - Admin
  /admin/reporting/activity-log-stats:
    get:
      description: Statistik aktivitas harian berdasarkan log
      parameters:
      - description: Tanggal mulai (YYYY-MM-DD)
        in: query
        name: startDate
        type: string
      - description: Tanggal akhir (YYYY-MM-DD)
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Statistik aktivitas harian
      tags:
      - Reporting
  /admin/reporting/growth-stats:
    get:
      description: Statistik pertumbuhan user dan resep harian
      parameters:
      - description: Tanggal mulai (YYYY-MM-DD)
        in: query
